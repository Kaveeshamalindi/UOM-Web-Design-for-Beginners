<html lang="en">
<head>
    <title>Responsive Image</title>

    </style>
</head>

<body>

    <img 
        src="https://images.pexels.com/photos/11906004/pexels-photo-11906004.jpeg"
        alt="UI/UX"
        class="responsive"
    >

</body>
</html>
